name: desktop builds
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # tauri-action creates the (draft) release and uploads the installers

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # Apple Silicon .dmg
            args: --target aarch64-apple-darwin
          - os: macos-latest        # Intel .dmg, cross-compiled (the macos-13 Intel runners are retired)
            args: --target x86_64-apple-darwin
          - os: ubuntu-22.04        # .deb + .AppImage
            args: ''
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: 'Augur ${{ github.ref_name }}'
          releaseDraft: true
          args: ${{ matrix.args }}
