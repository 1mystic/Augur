[package]
name = "augur"
version = "0.2.0"
description = "Augur — read a chessboard screenshot, continue the game, ask Stockfish"
authors = ["Atharv Khare"]
license = "GPL-3.0-or-later"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
